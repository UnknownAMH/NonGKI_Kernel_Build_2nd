name: Build Oppo F11 (CPH1911) (BakaSU + SUSFS + NoMount + Re:Kernel + Droidspaces) (Kernel 4.14)

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel branch to build (bakasu = stable, bakasu-test = experiments)"
        required: false
        default: "bakasu"
        type: string

env:
  # Device env
  DEVICE_NAME : "oppo_f11"
  DEVICE_CODENAME : "CPH1911"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : ""

  KERNEL_SOURCE : "https://github.com/UnknownAMH/Oppo-f11-kernal.git"
  # Overridable from "Run workflow" -> kernel_branch input; defaults to the
  # stable branch. Use bakasu-test for experimental SUSFS/hook work.
  KERNEL_BRANCH : ${{ github.event.inputs.kernel_branch || 'bakasu' }}

  # clang r383902 (the exact toolchain the verified local build used)
  CLANG_SOURCE : "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/3857008389202edac32d57008bb8c99d2c957f9d/clang-r383902.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "lineage-19.1"
  GCC_32_SOURCE : "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "lineage-19.1"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "oppo6771_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # BakaSU kernel + uapi are committed in the kernel branch (KernelSU/VENDORED.md),
  # so the Kconfig option for CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER is part of the
  # tree instead of being injected into a fresh clone. No clone, no upstream drift.
  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_VENDORED : "true"
  KERNELSU_AUTO_GET : "false"
  KERNELSU_AUTO_FORK : "bakasu" # keeps the SUSFS config handling + Kconfig patch step

  SUSFS_ENABLE : true
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "coloros11_4.14"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3" # repo ships the customized Helicopterr AK3 template
  PACK_KMODULES: "true" # 6 vendor .ko (wlan/wmt/bt/gps/fm) built from the vendor tree below

  # The bakasu branch of KERNEL_SOURCE already has the full patch chain baked in
  # (BakaSU + SUSFS 2.4 + inline hooks + Re:Kernel + Droidspaces + NoMount).
  # Running clean_hook/patch steps on a pre-patched tree would strip the hooks,
  # so all of them are skipped in build-oppo-f11.yml when this is "true".
  KERNEL_PREPATCHED: "true"

  KERNELSU_METHOD: "manual" # in-source integration, no kpimg

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false" # handled by the custom cgroup-v1 step below (Oppo 4.14 has no cgroup v2 freezer)
  DROIDSPACES_ENABLE: "true"
  NOMOUNT_ENABLE: "true"

  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "mediatek-mt6771"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "true"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: Oppo F11 (CPH1911) (Kernel 4.14)
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🔧 Patch PRIORITY_UID_FILTER into BakaSU Kconfig (10th SUSFS feature)
        if: env.KERNELSU_AUTO_FORK == 'bakasu' && env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # Single source of truth lives in the kernel branch. Fall back to an
          # inline insert for older branches that predate the script. Without
          # the option kconfig drops CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER
          # silently and the feature is compiled out with no error.
          if [ -f patch_bakasu_kconfig.sh ]; then
            bash ./patch_bakasu_kconfig.sh
          else
            echo "[!] script missing in this branch -- inline fallback"
            K=KernelSU/kernel/Kconfig
            if grep -q 'config KSU_SUSFS_PRIORITY_UID_FILTER' "$K"; then
              echo "[+] already present"
            else
              awk '/^menu "KernelSU - SUSFS"/ {m=1} m && /^endmenu/ && !d {print ""; print "config KSU_SUSFS_PRIORITY_UID_FILTER"; print "    bool \"Enable SUSFS priority UID filter\""; print "    depends on KSU_SUSFS"; print "    default y"; print "    help"; print "        Hide configured application UIDs from getpriority, setpriority,"; print "        ioprio_get, and ioprio_set for unprivileged app processes."; print ""; d=1; m=0} {print}' "$K" > "$K.new" && mv "$K.new" "$K"
            fi
          fi
          grep -q 'config KSU_SUSFS_PRIORITY_UID_FILTER' KernelSU/kernel/Kconfig \
            && echo "[+] Kconfig option present" \
            || { echo '[-] Kconfig option missing!'; exit 1; }

      # The kernel tree has 54 symlinks pointing into ../vendor/ (Oppo AOSP layout:
      # kernel + vendor sit side by side). CI only has the kernel repo, so provide
      # the genuine Oppo vendor source (all 54 targets verified inside oplus/ and
      # mediatek/proprietary/oplus/) — mirrors the local layout used for the
      # verified local build.
      - name: 📦 Provide vendor symlink targets
        run: |
          git clone --depth=1 -b oppo/mt6771_r_11 \
            https://github.com/oppo-source/android_kernel_modules_oppo_mt6771.git \
            $GITHUB_WORKSPACE/vendor_repo
          ln -s $GITHUB_WORKSPACE/vendor_repo/source/vendor $GITHUB_WORKSPACE/vendor
          ls $GITHUB_WORKSPACE/vendor/oplus/kernel | head -5
          # One drifted file vs the verified local copy: its #else branch (taken
          # when TARGET_PRODUCT is unset in kernel-only builds) includes
          # <soc/qcom/smem.h>, a QC header absent from this MT6771 tree. The
          # verified local copy uses <linux/uaccess.h> here — restore that.
          sed -i 's|#include <soc/qcom/smem.h>|#include <linux/uaccess.h>|' \
            $GITHUB_WORKSPACE/vendor_repo/source/vendor/oplus/secure/common/bsp/drivers/oppo_secure_common/oppo_secure_common.c
          grep -q 'linux/uaccess.h' $GITHUB_WORKSPACE/vendor_repo/source/vendor/oplus/secure/common/bsp/drivers/oppo_secure_common/oppo_secure_common.c \
            && echo "[+] oppo_secure_common include drift fixed." \
            || { echo '[-] oppo_secure_common sed failed!'; exit 1; }
          echo "[+] vendor/ in place — symlink targets resolved."

      # Visible replacement for the gated patch steps: prove the root stack is
      # already inside the branch instead of leaving six unexplained "skipped".
      - name: 🔎 Root stack pre-check (already baked into the bakasu branch)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          fail=0
          ok(){ echo "[+] $*"; }
          bad(){ echo "[-] $*"; fail=1; }
          echo "[i] KERNEL_PREPATCHED=true -> the patch steps below are skipped ON PURPOSE."
          echo "    SUSFS + inline hooks + Re:Kernel + Droidspaces + NoMount are committed in this branch."

          [ -f fs/susfs.c ] && [ -f include/linux/susfs_def.h ] && ok "SUSFS 2.4 source (fs/susfs.c, susfs_def.h)" || bad "SUSFS source missing"
          [ -f KernelSU/kernel/Kconfig ] && ok "KernelSU (BakaSU) source at ./KernelSU" || bad "KernelSU/ source missing (clone step failed)"
          [ -d drivers/net/rekernel ] && ok "Re:Kernel driver present" || bad "Re:Kernel missing"
          [ -f arch/arm64/configs/droidspaces.config ] && ok "Droidspaces config fragment present" || bad "Droidspaces config missing"
          [ -f NoMount/kernel/src/nomount.c ] && ok "NoMount source present" || bad "NoMount source missing"

          for pair in "fs/namespace.c" "fs/notify/fdinfo.c" "fs/proc/task_mmu.c"; do
            n=$(grep -c 'CONFIG_KSU_SUSFS' "$pair" || true)
            [ "$n" -gt 0 ] && ok "SUSFS hooks in $pair ($n)" || bad "no SUSFS hooks in $pair"
          done

          echo "--- root-related defconfig lines:"
          grep -E '^(CONFIG_KSU=|CONFIG_KSU_SUSFS[A-Z_]*=|CONFIG_REKERNEL=|CONFIG_NOMOUNT=|CONFIG_THREAD_INFO_IN_TASK=)' \
            arch/arm64/configs/oppo6771_defconfig || bad "no KSU/SUSFS lines in defconfig"
          count=$(grep -cE '^(CONFIG_KSU=|CONFIG_KSU_SUSFS[A-Z_]*=y|CONFIG_REKERNEL=|CONFIG_NOMOUNT=)' arch/arm64/configs/oppo6771_defconfig || true)
          ok "$count root-related config lines in oppo6771_defconfig"

          [ "$fail" -eq 0 ] || { echo '[-] root stack incomplete in this branch!'; exit 1; }
          echo '[+] root stack verified before the build (KSU + SUSFS + Re:Kernel + Droidspaces + NoMount).'

      - name: 🪝 Patch Kernel of SUSFS
        if: env.KERNEL_PREPATCHED != 'true'
        uses: ./.github/workflows/patch-susfs

      - name: 🩹 Oppo F11 SUSFS 2.4 hand-merge (namespace/fdinfo/task_mmu)
        if: env.KERNEL_PREPATCHED != 'true'
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          patch -p1 < /tmp/Patches/oppo_f11/susfs_24_fix.patch || { echo '[-] Oppo F11 susfs fix patch failed!'; exit 1; }
          echo '[+] Oppo F11 susfs fix patch applied.'

      - name: 🔗 Patch for inline hook
        if: env.KERNEL_PREPATCHED != 'true'
        uses: ./.github/workflows/patch-no-kprobe

      # Re:Kernel is pre-baked in kernel branch (drivers/net/rekernel/ + hooks in binder/signal).
      # The old patch step (for monolithic rekernel.c) is disabled via KERNEL_PREPATCHED=true.
      # New modular Re-Kernel (v11.7, Generic Netlink) builds from source in kernel branch.
      - name: 🧰 Patch Re:Kernel (DISABLED - pre-baked in kernel branch)
        if: false
        run: |
          echo "Re:Kernel patch disabled - driver is pre-baked in kernel branch"
          echo "Old patch (rekernel_patches.sh + rekernel_extra.patch) targeted old monolithic rekernel.c"
          echo "New driver: drivers/net/rekernel/{rekernel_main,netlink,binder,signal,netfilter}.c"
          echo "CONFIG_REKERNEL=y is set in defconfig"

      - name: 💿 Patch Kernel of Droidspaces
        if: env.KERNEL_PREPATCHED != 'true'
        uses: ./.github/workflows/patch-droidspaces

      - name: 🛡️ Patch Kernel of NoMount
        if: env.KERNEL_PREPATCHED != 'true'
        uses: ./.github/workflows/patch-nomount

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔍 Build output sanity check (KSU/SUSFS really in the kernel?)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "===== out/.config ====="
          grep -E 'CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=|CONFIG_REKERNEL=|CONFIG_NOMOUNT=|CONFIG_THREAD_INFO_IN_TASK=' out/.config || { echo '[-] KSU/SUSFS configs missing from out/.config!'; exit 1; }
          grep -q '^CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y' out/.config || { echo '[-] 10th SUSFS feature (PRIORITY_UID_FILTER) was dropped by kconfig - BakaSU Kconfig lacks the option!'; exit 1; }
          echo "===== image ====="
          ls -l out/arch/arm64/boot/Image.gz-dtb
          md5sum out/arch/arm64/boot/Image.gz-dtb
          echo "===== vmlinux strings ====="
          KSU_HITS=$(strings out/vmlinux | grep -cE 'ksud|KernelSU|susfs' || true)
          echo "KSU/SUSFS string hits: $KSU_HITS"
          [ "$KSU_HITS" -gt 0 ] || { echo '[-] vmlinux contains no KSU/SUSFS strings — patch chain did not take effect!'; exit 1; }
          echo '[+] Kernel verifiably contains KSU/SUSFS.'

      - name: 📦 Build Oppo F11 vendor modules (wlan/wmt/bt/gps/fm)
        shell: bash
        run: |
          set -o pipefail
          cd $GITHUB_WORKSPACE/device_kernel

          # The kernel build step exports clang into PATH only inside its own run
          # block, so a separate step has NO clang in PATH -> "ccache clang" fails.
          # Add the toolchain bin dir explicitly (same one build-process uses).
          export PATH="$GITHUB_WORKSPACE/clang-custom/bin:$PATH"
          command -v clang >/dev/null || { echo '[-] clang not found in PATH'; ls "$GITHUB_WORKSPACE/clang-custom/bin" 2>/dev/null | head -20; exit 1; }
          echo "[+] clang: $(command -v clang) -> $(clang --version | head -1)"
          OBJCOPY=$(command -v llvm-objcopy || true)
          [ -x "$OBJCOPY" ] || OBJCOPY="$GITHUB_WORKSPACE/clang-custom/bin/llvm-objcopy"
          [ -x "$OBJCOPY" ] || { echo '[-] llvm-objcopy not found'; exit 1; }
          echo "[+] llvm-objcopy: $OBJCOPY"

          # CROSS_COMPILE normally comes from GITHUB_ENV (found_gcc.sh); derive it
          # from gcc-64/bin if that ever stops happening.
          if [ -z "${CROSS_COMPILE:-}" ]; then
            _gcc=$(ls "$GITHUB_WORKSPACE"/gcc-64/bin/*-gcc 2>/dev/null | head -1)
            CROSS_COMPILE="${_gcc%-gcc}-"     # .../bin/aarch64-linux-android-
            echo "[!] CROSS_COMPILE was empty, derived: $CROSS_COMPILE"
          fi
          echo "[+] CROSS_COMPILE: $CROSS_COMPILE"

          export CONFIG_MTK_PLATFORM=mt6771
          export TARGET_BUILD_VARIANT=user
          export AUTOCONF_H=$PWD/out/include/generated/autoconf.h
          MOD_SRC="$GITHUB_WORKSPACE/vendor_repo/source/vendor/mediatek/kernel_modules"
          [ -d "$MOD_SRC" ] || { echo "[-] module source tree missing: $MOD_SRC"; exit 1; }
          mkdir -p out/vendor-modules

          # Module-to-module deps: wmt_chrdev_wifi/wlan_drv_gen3/bt_drv use symbols
          # exported by wmt_drv (mtk_wcn_wmt_func_on/off, ...). Standalone 'make M='
          # builds do not see each other's Module.symvers, so chain them.
          # This 4.14 modpost reads only ONE extra symvers file (-e stores a
          # single entry), so merge every previous module's exports into one.
          EXTRA_SYMS=/tmp/vendor-extra.symvers
          : > "$EXTRA_SYMS"
          for pair in \
            "wmt_drv.ko connectivity/common" \
            "wmt_chrdev_wifi.ko connectivity/wlan/adaptor" \
            "wlan_drv_gen3.ko connectivity/wlan/core/gen3" \
            "bt_drv.ko connectivity/bt/mt66xx/legacy" \
            "gps_drv.ko connectivity/gps" \
            "fmradio_drv.ko connectivity/fmradio"; do
            set -- $pair
            echo "=== building $1 ($2)"
            LOG=/tmp/mod-$1.log
            EXTRA_ARG=""
            if [ -n "$EXTRA_SYMS" ]; then EXTRA_ARG="KBUILD_EXTRA_SYMBOLS=$EXTRA_SYMS"; fi
            echo "    extra symbols: $EXTRA_SYMS ($(wc -l < "$EXTRA_SYMS") exported)"
            if ! make -j$(nproc) O=out ARCH=arm64 CC="ccache clang" \
                   CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE="$CROSS_COMPILE" \
                   $EXTRA_ARG KBUILD_MODPOST_WARN=1 M="$MOD_SRC/$2" modules 2>&1 | tee "$LOG"; then
              echo "[-] module $1 build failed -- last 60 log lines:"
              tail -60 "$LOG"
              exit 1
            fi
            [ -f "$MOD_SRC/$2/$1" ] || { echo "[-] $1 not produced"; exit 1; }
            # export this module's symbols to the modules built after it
            if [ -f "$MOD_SRC/$2/Module.symvers" ]; then
              cat "$MOD_SRC/$2/Module.symvers" >> "$EXTRA_SYMS"
            fi
            "$OBJCOPY" --strip-debug "$MOD_SRC/$2/$1" "out/vendor-modules/$1"
          done

          ls -l out/vendor-modules/
          echo "[+] vermagic of each packed module:"
          for ko in out/vendor-modules/*.ko; do echo "$(basename $ko): $(strings -a $ko | grep -m1 vermagic=)"; done
          echo '[+] Vendor modules built.'

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
