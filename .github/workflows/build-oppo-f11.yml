name: Build Oppo F11 (CPH1911) (BakaSU + SUSFS + NoMount + Re:Kernel + Droidspaces) (Kernel 4.14)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "oppo_f11"
  DEVICE_CODENAME : "CPH1911"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : ""

  KERNEL_SOURCE : "https://github.com/UnknownAMH/Oppo-f11-kernal.git"
  KERNEL_BRANCH : "bakasu"

  # clang r383902 (the exact toolchain the verified local build used)
  CLANG_SOURCE : "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/3857008389202edac32d57008bb8c99d2c957f9d/clang-r383902.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "lineage-19.1"
  GCC_32_SOURCE : "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "lineage-19.1"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "oppo6771_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "bakasu"

  SUSFS_ENABLE : true
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "coloros11_4.14"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3" # repo already ships its own customized AnyKernel3/
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "manual" # in-source integration, no kpimg

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false" # handled by the custom cgroup-v1 step below (Oppo 4.14 has no cgroup v2 freezer)
  DROIDSPACES_ENABLE: "true"
  NOMOUNT_ENABLE: "true"

  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "mediatek-mt6771"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "true"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: Oppo F11 (CPH1911) (Kernel 4.14)
    runs-on: ubuntu-24.04
    container: ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      # The kernel tree has 54 symlinks pointing into ../vendor/ (Oppo AOSP layout:
      # kernel + vendor sit side by side). CI only has the kernel repo, so provide
      # the genuine Oppo vendor source (all 54 targets verified inside oplus/ and
      # mediatek/proprietary/oplus/) — mirrors the local layout used for the
      # verified local build.
      - name: 📦 Provide vendor symlink targets
        run: |
          git clone --depth=1 -b oppo/mt6771_r_11 \
            https://github.com/oppo-source/android_kernel_modules_oppo_mt6771.git \
            $GITHUB_WORKSPACE/vendor_repo
          ln -s $GITHUB_WORKSPACE/vendor_repo/source/vendor $GITHUB_WORKSPACE/vendor
          ls $GITHUB_WORKSPACE/vendor/oplus/kernel | head -5
          # One drifted file vs the verified local copy: its #else branch (taken
          # when TARGET_PRODUCT is unset in kernel-only builds) includes
          # <soc/qcom/smem.h>, a QC header absent from this MT6771 tree. The
          # verified local copy uses <linux/uaccess.h> here — restore that.
          sed -i 's|#include <soc/qcom/smem.h>|#include <linux/uaccess.h>|' \
            $GITHUB_WORKSPACE/vendor_repo/source/vendor/oplus/secure/common/bsp/drivers/oppo_secure_common/oppo_secure_common.c
          grep -q 'linux/uaccess.h' $GITHUB_WORKSPACE/vendor_repo/source/vendor/oplus/secure/common/bsp/drivers/oppo_secure_common/oppo_secure_common.c \
            && echo "[+] oppo_secure_common include drift fixed." \
            || { echo '[-] oppo_secure_common sed failed!'; exit 1; }
          echo "[+] vendor/ in place — symlink targets resolved."

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🩹 Oppo F11 SUSFS 2.4 hand-merge (namespace/fdinfo/task_mmu)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          patch -p1 < /tmp/Patches/oppo_f11/susfs_24_fix.patch || { echo '[-] Oppo F11 susfs fix patch failed!'; exit 1; }
          echo '[+] Oppo F11 susfs fix patch applied.'

      - name: 🔗 Patch for inline hook
        uses: ./.github/workflows/patch-no-kprobe

      # Re:Kernel with cgroup-v1 adaptation (Oppo 4.14 has no cgroup v2 freezer;
      # a v2 task_struct backport would break prebuilt module CRCs under MODVERSIONS)
      - name: 🧰 Patch Re:Kernel (Oppo F11 cgroup-v1 adapted)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          cp /tmp/Patches/Rekernel/rekernel_patches.sh ./
          bash rekernel_patches.sh
          cp /tmp/Patches/Rekernel/rekernel_extra.patch ./
          # drop the v2-only cgroup_task_frozen() call (freezer.h is already included by the patch)
          sed -i 's/cgroup_task_frozen(task) || //' rekernel_extra.patch
          grep -q 'return (cgroup_freezing(task));' rekernel_extra.patch || { echo '[-] frozen_task_group sed failed!'; exit 1; }
          patch -p1 < rekernel_extra.patch || { echo '[-] Re:Kernel patch failed!'; exit 1; }
          echo "CONFIG_REKERNEL=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo '[+] Re:Kernel patched (cgroup v1 adaptation).'

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
